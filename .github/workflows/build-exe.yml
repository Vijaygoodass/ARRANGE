name: Build Windows EXE

on:
  push:
    branches: [ Index, main, master ]
  pull_request:
    branches: [ Index, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller kivy
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "ARRANGE" file_organizer.py
      shell: cmd
    
    - name: Upload EXE to artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: arrange-windows-exe
        path: dist/ARRANGE.exe
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ARRANGE.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
